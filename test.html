<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>STEP3 テスト</title>
    <link rel="stylesheet" href="test.css">
</head>
<body>
    <header>
        <h2>世界一甘いお店</h2>
    </header>

    <div class="container">
        <aside class="sidebar">
            <ul>
                <li><a href="#">トップ</a></li>
                <li><a href="#">新着情報</a></li>
                <li><a href="#">おすすめのスイーツ</a></li>
                <li><a href="#">お問い合わせ</a></li>
            </ul>
        </aside>

        <main>
            <form>
                <table>
                    <tr>
                        <th>お名前</th>
                        <td><input type="text" name="username" size="40"></td> </tr>
                    <tr>
                        <th>電話</th>
                        <td><input type="tel" name="tel_1" size="40"></td> </tr>
                    <tr>
                        <th>電話番号</th>
                        <td><input type="tel" name="tel_2" size="40"></td> </tr>
                    <tr>
                        <th>メールアドレス</th>
                        <td><input type="email" name="email" size="40"></td> </tr>
                    <tr>
                        <th>お問い合わせ内容</th>
                        <td><textarea name="message" cols="30" rows="4"></textarea></td> </tr>
                    </tr>
                </table>
                <div class="submit-container">
                    <input type="submit" value="送信">
                </div>
            </form>
        </main>
    </div>

    <footer>
        <p></p>
    </footer>
</body>
</html>
