<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>STEP3 テスト</title>
    <link rel="stylesheet" href="test.css">
</head>
<body>
    <header>
        <h2>世界一甘いお店</h2>
    </header>
    <div class="container">
        <aside class="sidebar">
            <ul>
                <li><a href="#">トップ</a></li>
                <li><a href="#">新着情報</a></li>
                <li><a href="#">おすすめのスイーツ</a></li>
                <li><a href="#">お問い合わせ</a></li>
            </ul>
        </aside>
        <main>
            <form>
                <table>
                    <tr>
                        <th>お名前</th>
                        <td><input type="text" name="username" size="40"></td>
                    </tr>
                    <tr>
                        <th>お近くのお店</th>
                        <td>
                            <select name="shop">
                                <option value="hokkaido">北海道・東北</option>
                                <option value="kanto">関東</option>
                                <option value="chubu">中部</option>
                                <option value="kansai">関西</option>
                                <option value="chugoku-shikoku">中国・四国</option>
                                <option value="kyushu-okinawa">九州・沖縄</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <th>電話</th>
                        <td><input type="tel" name="tel_prefix" size="40"></td>
                    </tr>
                    <tr>
                        <th>電話番号</th>
                        <td><input type="tel" name="tel_number" size="40"></td>
                    </tr>
                    <tr>
                        <th>メールアドレス</th>
                        <td><input type="email" name="email" size="40"></td>
                    </tr>
                    <tr>
                        <th>お問い合わせ種別</th>
                        <td>
                            <input type="radio" name="type" id="product" value="product"> <label for="product">商品について</label>
                            <input type="radio" name="type" id="staff" value="staff"> <label for="staff">従業員について</label>
                        </td>
                    </tr>
                    <tr>
                        <th>お問い合わせ内容</th>
                        <td><textarea name="message" cols="30" rows="4" placeholder="詳細を入力してください"></textarea></td>
                    </tr>
                </table>
                <div class="submit-container">
                    <input type="submit" value="送信">
                </div>
            </form>
        </main>
    </div>
    <footer></footer>
</body>
</html>
